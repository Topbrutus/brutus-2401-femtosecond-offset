<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#000"/>
  <g fill="#fff" font-family="Georgia, Times New Roman, serif" text-anchor="middle">
    <text x="600" y="90" font-size="40">1/240.1 - 1/f = 10^-15 s</text>
    <text x="600" y="175" font-size="36">f = 1 / (1/240.1 - 10^-15)</text>
    <rect x="155" y="215" width="890" height="82" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="600" y="270" font-size="34">f ≈ 240.1000000000576480100000138412872 Hz</text>
    <text x="600" y="365" font-size="32">Δf ≈ 5.764801000001384 × 10^-11 Hz</text>
  </g>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25">
    <text x="85" y="455">SOURCE: mathematical construction</text>
